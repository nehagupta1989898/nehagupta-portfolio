<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neha Gupta, 3D Portfolio Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#CFE3E0; --paper:#FFFDFB; --ink:#12313A; --muted:#4A6269; --line:#D9E3E1; --edge:#E4DDD3;
  --teal:#0E5A64; --rose:#F25C78; --butter:#FFD166; --lilac:#B8A1F5; --sky:#6EC5E9;
  --head:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --pw:min(440px,calc((100vw - 56px)/2)); --ph:min(580px,calc(100svh - 170px));
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--desk:#06191D;--paper:#12343B;--ink:#EAF6F4;--muted:#9DBFC2;--line:#28545B;--edge:#0B2227;color-scheme:dark}
}
:root[data-theme="dark"]{--desk:#06191D;--paper:#12343B;--ink:#EAF6F4;--muted:#9DBFC2;--line:#28545B;--edge:#0B2227;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--desk) 70%,#fff) 0,var(--desk) 70%);color:var(--ink);font:400 .95rem/1.5 var(--body);display:flex;flex-direction:column;align-items:center;overflow:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--head);font-weight:400;margin:0;line-height:1.08}
p{margin:0 0 .8em}

.stage{flex:1;min-height:0;width:100%;display:grid;place-items:center;perspective:2600px}
.tilt{transform-style:preserve-3d;transform:rotateX(var(--rx,7deg)) rotateY(var(--ry,-8deg));transition:transform .3s ease-out}
.book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.dsk{width:calc(var(--pw)*2);height:var(--ph)}
.dsk.f0{transform:translateX(calc(var(--pw)*-.5))}
.dsk::before{content:"";position:absolute;inset:-9px;background:var(--teal);border-radius:20px;transform:translateZ(-10px);box-shadow:0 30px 60px rgba(6,25,29,.35);transition:left .9s,width .9s}
.dsk.f0::before{left:calc(50% - 9px);width:calc(var(--pw) + 18px)}
.sheet,.base{position:absolute;left:50%;top:0;width:var(--pw);height:100%}
.sheet{transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.25,1)}
.sheet.fl{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sheet .face.L{transform:rotateY(180deg)}
.face.R{border-radius:3px 16px 16px 3px;box-shadow:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge)}
.face.L{border-radius:16px 3px 3px 16px;box-shadow:-1px 1px 0 var(--edge),-2px 2px 0 var(--edge),-3px 3px 0 var(--edge),-4px 4px 0 var(--edge)}
.face.R::after,.face.L::after{content:"";position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
.face.R::after{left:0;background:linear-gradient(90deg,rgba(18,49,58,.22),transparent)}
.face.L::after{right:0;background:linear-gradient(270deg,rgba(18,49,58,.22),transparent)}
.pad{position:absolute;inset:0;padding:clamp(20px,3vw,34px);overflow:auto;display:flex;flex-direction:column}

.mob .leaf{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;transition:transform .85s cubic-bezier(.5,.1,.2,1),opacity .25s .55s}
.mob .leaf.gone{transform:rotateY(-115deg);opacity:0;pointer-events:none}
.mob .leaf:not(.gone){transition:transform .85s cubic-bezier(.5,.1,.2,1),opacity 0s}
.mob .face{border-radius:4px 18px 18px 4px;box-shadow:3px 3px 0 var(--edge),0 20px 40px rgba(6,25,29,.3)}
.mob .face::after{display:none}

.cv{background:var(--teal);color:#fff}
.cv .pad{border-left:14px solid rgba(0,0,0,.2);justify-content:space-between}
.cv h1{font-size:clamp(2.6rem,5vw,3.9rem);color:var(--butter)}
.cv p{font-size:1.02rem;max-width:26ch;margin-top:10px}
.cv svg{width:100%;height:auto;margin:6px 0}
.go{display:inline-block;border:0;cursor:pointer;font-weight:700;text-decoration:none;background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px}
.cv .go{background:var(--butter);color:#12313A;align-self:flex-start}
.go:hover{background:var(--rose);color:#12313A}
.go.alt{background:transparent;box-shadow:inset 0 0 0 2px currentColor;color:inherit}

h2{font-size:clamp(1.55rem,2.6vw,2.1rem);margin-bottom:12px}
.muted{color:var(--muted)}
.art svg{width:100%;height:auto;margin-top:auto}
.art h2{margin-bottom:10px}
.ink{color:#12313A}.on-teal{background:var(--teal);color:#fff}
.toc{list-style:none;margin:0;padding:0}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:1.02rem}
.toc button:hover{color:var(--rose)}.toc button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.toc span{font-weight:400;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 14px;font-size:.88rem}
dt{font-weight:700}dd{margin:0;color:var(--muted)}
.cs h4{font-family:var(--body);font-weight:700;font-size:.96rem;margin:0 0 1px}
.cs p{font-size:.92rem;margin-bottom:.7em}
.cs a{font-weight:700;color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cs a{color:var(--sky)}}
:root[data-theme="dark"] .cs a{color:var(--sky)}
h3{font-family:var(--body);font-weight:700;font-size:.98rem;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:6px 0 14px;list-style:none;font-size:.84rem}
.chips li{padding:5px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.tl{list-style:none;margin:6px 0 0;padding:0;border-left:3px solid var(--teal)}
.tl li{padding:0 0 16px 18px;position:relative}
.tl li::before{content:"";position:absolute;left:-10px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 4px var(--paper)}
.tl b{display:block}.tl span{font-size:.86rem;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:8px}
.row .go{background:var(--teal);color:#fff}.row .go.alt{background:transparent;color:inherit}

.nav{display:flex;align-items:center;gap:14px;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.nav>button{border:0;cursor:pointer;background:var(--ink);color:var(--desk);font-weight:700;padding:10px 20px;border-radius:999px}
.nav>button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;border:0;cursor:pointer;background:var(--line)}
.dots button[aria-current="true"]{background:var(--rose);transform:scale(1.35)}
.count{min-width:9em;text-align:center;font-size:.9rem;color:var(--muted)}

@media (max-width:820px){
  :root{--pw:min(430px,calc(100vw - 32px));--ph:min(620px,calc(100svh - 150px))}
  .mob{width:var(--pw);height:var(--ph)}
  .dots{display:none}.count{min-width:0}
  .tilt{transform:none}
}
@media (prefers-reduced-motion:reduce){.book,.sheet,.leaf,.leaf:not(.gone),.dsk::before,.tilt{transition:none!important}}
</style>
</head>

function show(n){
  var max=mobile?F.length-1:N;
  cur=Math.max(0,Math.min(max,n));
  var all=faces(),vis=[];
  if(mobile){
    els.forEach(function(e,i){e.classList.toggle("gone",i<cur);});
    vis=[cur];
  }else{
    sheets.forEach(function(s,i){
      var fl=i<cur;
      if(s._fl!==fl){s._fl=fl;s.classList.toggle("fl",fl);s.style.zIndex=100;setTimeout(function(){s.style.zIndex=fl?i:N-i;},450);}
    });
    book.classList.toggle("f0",cur===0);
    vis=cur===0?[0]:[2*cur-1,2*cur];
  }
  var order=mobile?all:[].slice.call(book.querySelectorAll(".sheet .face.R,.sheet .face.L,.base .face"));
  var idxMap=[];
  if(!mobile){sheets.forEach(function(s,i){idxMap[2*i]=s.querySelector(".face.R");idxMap[2*i+1]=s.querySelector(".face.L");});idxMap[14]=book.querySelector(".base .face");}
  (mobile?all:idxMap).forEach(function(f,j){f.inert=vis.indexOf(j)<0;});
  dots.querySelectorAll("button").forEach(function(b,i){b.setAttribute("aria-current",i===cur?"true":"false");});
  document.getElementById("count").textContent=mobile?"Page "+(cur+1)+" of "+F.length:spreadNames[cur];
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===max;
}
function goFace(j){show(mobile?j:(j===0?0:Math.floor((j+1)/2)));}
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){goFace(+g.dataset.go);return;}
  var d=e.target.closest("[data-sp]");if(d){show(+d.dataset.sp);return;}
  if(e.target.closest("a,button"))return;
  var f=e.target.closest(".face");if(!f)return;
  if(f.classList.contains("cv")){show(cur+1);return;}
  if(!mobile&&f.classList.contains("L"))show(cur-1);else show(cur+1);
});
document.getElementById("prev").onclick=function(){show(cur-1)};
document.getElementById("next").onclick=function(){show(cur+1)};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(cur+1);else if(e.key==="ArrowLeft")show(cur-1);});
var sx=null;
book.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
book.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60)show(cur+(dx<0?1:-1));},{passive:true});
var tilt=document.getElementById("tilt");
document.addEventListener("mousemove",function(e){
  if(mobile||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  tilt.style.setProperty("--ry",(-8+x*14)+"deg");tilt.style.setProperty("--rx",(7-y*10)+"deg");
});
var mq=matchMedia("(max-width:820px)");
mq.addEventListener("change",function(){var m=cur;var was=mobile;build();show(was?(m===0?0:Math.floor((m+1)/2)):(m===0?0:2*m-1));});
build();show(0);
</script>
</body>
</html>
